name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Dependency advisories land after a commit is merged, so re-run weekly.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit

      # --skip-editable: the project itself is installed from the checkout and
      # has no release to look up, and --strict would turn that into a failure.
      - name: pip-audit
        run: pip-audit --strict --skip-editable --progress-spinner off

  code:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install "bandit[toml]"

      # The generated wrapper modules are data, not logic: they declare props.
      - name: bandit
        run: |
          bandit -r \
            custom_components/reflex_reactbits/base.py \
            custom_components/reflex_reactbits/catalog.py \
            custom_components/reflex_reactbits/cli.py \
            custom_components/reflex_reactbits/source.py \
            scripts/generate_wrappers.py \
            reactbits_demo/reactbits_demo \
            --severity-level medium --confidence-level medium

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v3

  review:
    name: Dependency review
    # Only a pull request has a base to diff the dependency graph against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
